version: "3.9"

services:
  bot:
    build: .
    container_name: yt-music-tg-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      # Persist data across restarts
      - ./oauth.json:/app/oauth.json
      - ./songs.db:/app/songs.db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
